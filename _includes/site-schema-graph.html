<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
      "name": "{{ site.name }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.baseurl }}/{{ site.logo }}"
      },
      "description": "{{ site.description | escape }}",
      "inLanguage": "ro",
      "founder": { "@id": "{{ site.url }}{{ site.baseurl }}/#person-ana" },
      "knowsAbout": ["Călătorii", "Planificare vacanțe", "Ghiduri turistice", "Bugete de călătorie"]
    },
    {
      "@type": "Person",
      "@id": "{{ site.url }}{{ site.baseurl }}/#person-ana",
      "name": "{{ site.author.name | default: 'Ana' }}",
      "url": "{{ site.url }}{{ site.baseurl }}{{ site.author.url | default: '/despre/' }}",
      "jobTitle": "Autor de ghiduri de călătorie",
      "worksFor": { "@id": "{{ site.url }}{{ site.baseurl }}/#organization" },
      "knowsAbout": ["Călătorii", "Itinerarii", "Bugete de vacanță"]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}{{ site.baseurl }}/#website",
      "name": "{{ site.name }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "description": "{{ site.description | escape }}",
      "inLanguage": "ro",
      "publisher": { "@id": "{{ site.url }}{{ site.baseurl }}/#organization" }
    },
    {
      "@type": "Blog",
      "@id": "{{ site.url }}{{ site.baseurl }}/#blog",
      "name": "{{ site.name }}",
      "description": "{{ site.description | escape }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "inLanguage": "ro",
      "publisher": { "@id": "{{ site.url }}{{ site.baseurl }}/#organization" }{% if page.url == '/' %},
      "blogPost": [
        {% for post in site.posts limit: 10 %}
        {
          "@type": "BlogPosting",
          "@id": "{{ site.url }}{{ site.baseurl }}{{ post.url }}#blogposting",
          "headline": {{ post.title | jsonify }},
          "url": "{{ site.url }}{{ site.baseurl }}{{ post.url }}",
          "datePublished": "{{ post.date | date_to_xmlschema }}",
          "dateModified": "{% if post.last_modified_at %}{{ post.last_modified_at | date_to_xmlschema }}{% else %}{{ post.date | date_to_xmlschema }}{% endif %}",
          "inLanguage": "ro",
          "author": { "@id": "{{ site.url }}{{ site.baseurl }}/#person-ana" },
          "image": "{% if post.image %}{{ site.url }}{{ site.baseurl }}/{{ post.image }}{% else %}{{ site.url }}{{ site.baseurl }}/{{ site.og_image }}{% endif %}"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]{% endif %}
    }
  ]
}
</script>
