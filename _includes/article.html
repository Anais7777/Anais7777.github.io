<!-- Post, Page Content
================================================== -->
<div class="article-post">
    <!-- Toc if any -->
    {% if page.toc %}
    <div class="toc mt-4 mb-4">
        <h2 class="font-weight-bold toc-title">{% if page.beforetoc %}{{ page.beforetoc }}{% else %}Cuprins{% endif %}</h2>
        {% include toc.html html=content %}
    </div>
    {% endif %}
    <!-- End Toc -->
    {% include island-group.html %}
    {{content}}
</div>
