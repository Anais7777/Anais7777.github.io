---
layout: default
title: Home
---

<!-- Structured Data - Blog/CollectionPage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "{{ site.name }}",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.name }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}{{ site.baseurl }}/{{ site.logo }}"
    }
  },
  "blogPost": [
    {% for post in site.posts limit: 10 %}
    {
      "@type": "BlogPosting",
      "headline": "{{ post.title | escape }}",
      "url": "{{ site.url }}{{ site.baseurl }}{{ post.url }}",
      "datePublished": "{{ post.date | date_to_xmlschema }}",
      "dateModified": "{% if post.last_modified_at %}{{ post.last_modified_at | date_to_xmlschema }}{% else %}{{ post.date | date_to_xmlschema }}{% endif %}",
      "image": "{% if post.image %}{{ site.url }}{{ site.baseurl }}/{{ post.image }}{% else %}{{ site.url }}{{ site.baseurl }}/{{ site.og_image }}{% endif %}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>

<!-- Posts Index
================================================== -->
<div class="blog-grid-container">
    {% for post in paginator.posts %}
        {% include postbox.html %}
    {% endfor %}
</div>

<!-- Pagination
================================================== -->
<div class="bottompagination">
<span class="navigation" role="navigation">
    {% include pagination.html %}
</span>
</div>
